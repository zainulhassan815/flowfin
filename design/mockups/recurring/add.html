<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowFin — Add Recurring / Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080A;
  --surface: #101013;
  --surface-2: #16161A;
  --surface-3: #1C1C20;
  --border: #1E1E22;
  --border-strong: #2A2A2F;
  --text: #F2F2F4;
  --text-mute: #B4B4BC;
  --text-soft: #8A8A92;
  --text-faint: #565660;

  --page-bg: #1C1C20;

  --accent: #E8DCC0;
  --pos: #9CD4A2;
  --warn: #E8B66E;
  --neg: #E08A8A;
  --transfer: #82C5D4;

  --cat-bank: #82C5D4;
  --cat-cash: #C5D982;
  --cat-food: #E8A87B;
  --cat-transport: #8AB4E0;
  --cat-fun: #C98ED4;
  --cat-subs: #9A8AE0;
  --cat-rent: #D89A82;
  --cat-utilities: #E8CC7B;
  --cat-health: #DC8A8A;

  --font-serif: 'Literata';
  --font-mono: 'Geist Mono';
}

html, body { height: 100%; }
body {
  background: var(--page-bg);
  color: var(--text);
  font-family: var(--font-serif), serif;
  font-feature-settings: "ss01" 1, "ss02" 1, "calt" 1;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  min-height: 100vh;
  overflow-x: hidden;
}

.caption {
  position: fixed; top: 28px; left: 32px;
  font-family: var(--font-mono), monospace;
  font-size: 11px; color: var(--text-mute);
  letter-spacing: 0.18em; text-transform: uppercase;
  z-index: 10; font-weight: 500;
}
.caption em {
  display: block; margin-top: 6px;
  font-family: var(--font-serif), serif;
  font-style: italic; font-size: 15px; color: var(--text);
  letter-spacing: 0; text-transform: none;
  font-weight: 400; opacity: 0.85;
}
.caption-r {
  position: fixed; bottom: 28px; left: 32px;
  font-family: var(--font-mono), monospace;
  font-size: 11px; color: var(--text-mute);
  letter-spacing: 0.18em; text-transform: uppercase;
  z-index: 10; font-weight: 500;
}

/* ===== Phone ===== */
.phone {
  width: 390px; height: 844px;
  background: var(--bg); border-radius: 52px;
  position: relative; overflow: hidden;
  box-shadow:
    0 0 0 2px #1A1A1E,
    0 0 0 12px #0A0A0C,
    0 0 0 13px #3A3A42,
    0 24px 48px rgba(0,0,0,0.28),
    0 6px 14px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
}
.notch {
  position: absolute; top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 32px;
  background: #000; border-radius: 20px; z-index: 30;
}
.status-bar {
  height: 50px; padding: 18px 32px 0;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono), monospace;
  font-size: 14px; font-weight: 500;
  position: relative; z-index: 5; flex-shrink: 0;
}
.status-icons { display: flex; gap: 5px; align-items: center; }

/* ===== Header ===== */
.app-header {
  height: 56px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.btn-back {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none;
  color: var(--text-mute); cursor: pointer;
  margin-left: -8px;
}
.btn-back:hover { color: var(--text); }
.app-title {
  font-family: var(--font-serif), serif;
  font-style: italic; font-weight: 400;
  font-size: 17px; letter-spacing: -0.01em;
  color: var(--text);
}
.header-spacer { width: 30px; }

/* ===== Scroll content ===== */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 24px;
}
.scroll::-webkit-scrollbar { display: none; }

/* ===== Amount display ===== */
.amount-display {
  padding: 22px 20px 22px;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 10px;
  position: relative;
  border-bottom: 1px solid var(--border);
}
.amount-currency {
  font-family: var(--font-serif), serif;
  font-style: italic;
  font-size: 24px;
  font-weight: 400;
  color: var(--text-mute);
  letter-spacing: -0.02em;
}
.amount-value {
  font-family: var(--font-mono), monospace;
  font-size: 50px;
  font-weight: 400;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--text);
}
.amount-decimal {
  font-family: var(--font-mono), monospace;
  font-size: 22px;
  font-weight: 400;
  color: var(--text-mute);
}
.amount-cursor {
  width: 2px;
  height: 36px;
  background: var(--accent);
  border-radius: 1px;
  animation: blink 1s infinite;
  align-self: center;
  margin-left: -4px;
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* ===== Section ===== */
.field-section {
  padding: 16px 20px 4px;
}
.field-label {
  font-family: var(--font-mono), monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-soft);
  font-weight: 500;
  margin-bottom: 10px;
}

/* ===== Name input ===== */
.name-input {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0 12px;
  border-bottom: 1px solid var(--border-strong);
}
.name-value {
  flex: 1;
  font-family: var(--font-serif), serif;
  font-size: 22px;
  letter-spacing: -0.01em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 3px;
}
.name-cursor {
  display: inline-block;
  width: 1.5px;
  height: 22px;
  background: var(--accent);
  border-radius: 1px;
  animation: blink 1s infinite;
}
.edit-icon { color: var(--text-faint); flex-shrink: 0; }

/* ===== Segmented control (frequency) ===== */
.segmented {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  gap: 2px;
}
.seg-item {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  border-radius: 9px;
  font-family: var(--font-serif), serif;
  font-size: 15px;
  color: var(--text-soft);
  cursor: pointer;
  border: none;
  background: transparent;
  letter-spacing: -0.01em;
  transition: all .15s;
}
.seg-item:hover { color: var(--text-mute); }
.seg-item.active {
  background: rgba(232,220,192,0.10);
  color: var(--text);
  font-style: italic;
  box-shadow: inset 0 0 0 1px rgba(232,220,192,0.18);
}

/* ===== Form row ===== */
.form-row {
  display: flex;
  align-items: center;
  padding: 13px 0;
  gap: 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.form-row:last-child { border-bottom: none; }

.form-row-label {
  font-family: var(--font-mono), monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-soft);
  width: 72px;
  flex-shrink: 0;
  font-weight: 500;
}

.form-row-value {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.form-row-icon {
  width: 28px; height: 28px;
  border: 1px solid var(--icon-border, var(--border-strong));
  background: var(--icon-bg, transparent);
  border-radius: 8px;
  color: var(--icon-color, var(--text-mute));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.form-row-icon.cat-bank { --icon-color: var(--cat-bank); --icon-border: rgba(130,197,212,0.32); --icon-bg: rgba(130,197,212,0.08); }
.form-row-icon.cat-subs { --icon-color: var(--cat-subs); --icon-border: rgba(154,138,224,0.36); --icon-bg: rgba(154,138,224,0.08); }

.form-row-text {
  flex: 1;
  font-family: var(--font-serif), serif;
  font-size: 16px;
  color: var(--text);
  letter-spacing: -0.01em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.form-row-text.placeholder { color: var(--text-soft); font-style: italic; }

.form-row-aux {
  font-family: var(--font-mono), monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-mute);
  letter-spacing: -0.01em;
}

.form-row-chev { color: var(--text-faint); flex-shrink: 0; }

/* ===== Repeats-on stack ===== */
.repeats-row .form-row-text {
  display: flex; flex-direction: column; gap: 4px;
}
.repeats-row .next-info {
  font-family: var(--font-mono), monospace;
  font-size: 10px;
  color: var(--text-soft);
  letter-spacing: 0.06em;
  letter-spacing: 0.08em;
  font-style: normal;
}

/* ===== Section divider ===== */
.section-divider {
  height: 8px;
  background: var(--surface-2);
  margin: 12px 0;
}

/* ===== Sticky bottom CTA ===== */
.cta-bar {
  flex-shrink: 0;
  padding: 14px 20px 36px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.cta-save {
  width: 100%;
  height: 52px;
  background: var(--accent);
  color: #0A0A0B;
  border: none;
  border-radius: 14px;
  font-family: var(--font-mono), monospace;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background .15s;
}
.cta-save:hover { background: #F0E4C8; }
.cta-save svg { stroke: #0A0A0B; }

/* ===== Home indicator ===== */
.home-indicator {
  position: absolute;
  bottom: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: var(--text);
  border-radius: 3px;
  opacity: 0.4;
  z-index: 40;
}
</style>
</head>
<body>

<div class="caption">
  FlowFin / 06<br>
  <em>Add Recurring Payment — Full Screen</em>
</div>
<div class="caption-r">Mobile · 390 × 844 · Dark</div>

<div class="phone">
  <div class="notch"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
        <rect x="0.5" y="6.5" width="3" height="4" rx="0.5" fill="currentColor"/>
        <rect x="5" y="4.5" width="3" height="6" rx="0.5" fill="currentColor"/>
        <rect x="9.5" y="2.5" width="3" height="8" rx="0.5" fill="currentColor"/>
        <rect x="14" y="0.5" width="3" height="10" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M7.5 9.5L7.5 9.51" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M4.5 7C5.36 6.18 6.4 5.75 7.5 5.75C8.6 5.75 9.64 6.18 10.5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M2 4.5C3.5 3 5.4 2.25 7.5 2.25C9.6 2.25 11.5 3 13 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
      <svg width="27" height="12" viewBox="0 0 27 12" fill="none">
        <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" fill="none"/>
        <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/>
        <rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- Header -->
  <div class="app-header">
    <button class="btn-back" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18L9 12L15 6"/>
      </svg>
    </button>
    <div class="app-title">New recurring</div>
    <div class="header-spacer"></div>
  </div>

  <div class="scroll">

    <!-- Amount hero -->
    <div class="amount-display">
      <span class="amount-currency">Rs</span>
      <span class="amount-value">5,000</span>
      <span class="amount-decimal">.00</span>
      <span class="amount-cursor"></span>
    </div>

    <!-- Name -->
    <div class="field-section">
      <div class="field-label">Name</div>
      <div class="name-input">
        <span class="name-value">
          Gym Membership<span class="name-cursor"></span>
        </span>
        <svg class="edit-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
    </div>

    <!-- Frequency -->
    <div class="field-section">
      <div class="field-label">Frequency</div>
      <div class="segmented">
        <button class="seg-item">Weekly</button>
        <button class="seg-item active">Monthly</button>
        <button class="seg-item">Yearly</button>
      </div>
    </div>

    <!-- Repeats on -->
    <div class="field-section" style="padding-bottom: 12px;">
      <div class="field-label">Repeats on</div>
      <div class="form-row repeats-row" style="padding-top: 4px;">
        <div class="form-row-value">
          <div class="form-row-text">
            <span>25th of every month</span>
            <span class="next-info">Next: 25 Jun 2026 · in 30 days</span>
          </div>
          <svg class="form-row-chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3 2L7 5L3 8"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="section-divider"></div>

    <!-- Account + Category + Note -->
    <div class="field-section" style="padding-top: 4px; padding-bottom: 18px;">

      <div class="form-row">
        <div class="form-row-label">From</div>
        <div class="form-row-value">
          <div class="form-row-icon cat-bank">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>
            </svg>
          </div>
          <span class="form-row-text">Bank</span>
          <span class="form-row-aux">40,000</span>
          <svg class="form-row-chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3 2L7 5L3 8"/>
          </svg>
        </div>
      </div>

      <div class="form-row">
        <div class="form-row-label">Category</div>
        <div class="form-row-value">
          <div class="form-row-icon cat-subs">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>
            </svg>
          </div>
          <span class="form-row-text">Subscriptions</span>
          <svg class="form-row-chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3 2L7 5L3 8"/>
          </svg>
        </div>
      </div>

      <div class="form-row">
        <div class="form-row-label">Note</div>
        <div class="form-row-value">
          <span class="form-row-text placeholder">Monthly gym fees…</span>
        </div>
      </div>

    </div>

  </div>

  <!-- Sticky bottom CTA -->
  <div class="cta-bar">
    <button class="cta-save">
      Save Recurring
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <div class="home-indicator"></div>
</div>

</body>
</html>
