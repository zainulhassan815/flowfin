<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowFin — Transactions / Empty / Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080A;
  --surface: #101013;
  --surface-2: #16161A;
  --border: #1E1E22;
  --border-strong: #2A2A2F;
  --text: #F2F2F4;
  --text-mute: #B4B4BC;
  --text-soft: #8A8A92;
  --text-faint: #565660;
  --page-bg: #1C1C20;
  --accent: #E8DCC0;
  --font-serif: 'Literata';
  --font-mono: 'Geist Mono';
}

html, body { height: 100%; }
body {
  background: var(--page-bg);
  color: var(--text);
  font-family: var(--font-serif), serif;
  font-feature-settings: "ss01" 1, "ss02" 1, "calt" 1;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  padding: 60px 20px; min-height: 100vh; overflow-x: hidden;
}

.caption {
  position: fixed; top: 28px; left: 32px;
  font-family: var(--font-mono), monospace;
  font-size: 11px; color: var(--text-mute);
  letter-spacing: 0.18em; text-transform: uppercase;
  z-index: 10; font-weight: 500;
}
.caption em {
  display: block; margin-top: 6px;
  font-family: var(--font-serif), serif;
  font-style: italic; font-size: 15px; color: var(--text);
  letter-spacing: 0; text-transform: none; font-weight: 400; opacity: 0.85;
}
.caption-r {
  position: fixed; bottom: 28px; left: 32px;
  font-family: var(--font-mono), monospace;
  font-size: 11px; color: var(--text-mute);
  letter-spacing: 0.18em; text-transform: uppercase;
  z-index: 10; font-weight: 500;
}

.phone {
  width: 390px; height: 844px;
  background: var(--bg); border-radius: 52px;
  position: relative; overflow: hidden;
  box-shadow:
    0 0 0 2px #1A1A1E, 0 0 0 12px #0A0A0C, 0 0 0 13px #3A3A42,
    0 24px 48px rgba(0,0,0,0.28), 0 6px 14px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
}
.notch {
  position: absolute; top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 32px;
  background: #000; border-radius: 20px; z-index: 30;
}

.status-bar {
  height: 50px; padding: 18px 32px 0;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono), monospace;
  font-size: 14px; font-weight: 500;
  position: relative; z-index: 5; flex-shrink: 0;
}
.status-icons { display: flex; gap: 5px; align-items: center; }

.page-header {
  display: grid; grid-template-columns: 36px 1fr 36px;
  align-items: center; gap: 8px; padding: 14px 18px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.icon-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--border-strong);
  color: var(--text); cursor: pointer;
  border-radius: 50%; transition: background .15s, border-color .15s, color .15s;
}
.icon-btn:hover { background: rgba(255,255,255,0.04); border-color: var(--text-faint); }
.icon-btn.faint { color: var(--text-faint); border-color: var(--border); cursor: default; }
.topbar-title {
  text-align: center;
  font-family: var(--font-serif), serif;
  font-style: italic; font-weight: 300; font-size: 18px;
  letter-spacing: -0.01em; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== Empty state ===== */
.empty {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 0 40px 80px;
  gap: 16px;
}
.empty-mark {
  width: 76px; height: 76px;
  border-radius: 20px;
  border: 1px dashed var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  margin-bottom: 6px;
}
.empty-eyebrow {
  font-family: var(--font-mono), monospace;
  font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--text-faint); font-weight: 500;
}
.empty-title {
  font-family: var(--font-serif), serif;
  font-style: italic; font-weight: 300; font-size: 22px;
  color: var(--text); letter-spacing: -0.01em;
}
.empty-body {
  font-family: var(--font-serif), serif;
  font-size: 14px; color: var(--text-soft);
  line-height: 1.5; max-width: 240px;
}
.empty-cta {
  margin-top: 10px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #0A0A0B;
  border: none; border-radius: 11px;
  padding: 12px 18px; cursor: pointer;
  font-family: var(--font-mono), monospace;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
}

.home-indicator {
  position: absolute; bottom: 9px; left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px;
  background: var(--text); border-radius: 3px; opacity: 0.4; z-index: 6;
}
</style>
</head>
<body>

<div class="caption">
  FlowFin / 03e<br>
  <em>Transactions — Empty (nothing logged)</em>
</div>
<div class="caption-r">Mobile · 390 × 844 · Dark</div>

<div class="phone">
  <div class="notch"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
        <rect x="0.5" y="6.5" width="3" height="4" rx="0.5" fill="currentColor"/>
        <rect x="5" y="4.5" width="3" height="6" rx="0.5" fill="currentColor"/>
        <rect x="9.5" y="2.5" width="3" height="8" rx="0.5" fill="currentColor"/>
        <rect x="14" y="0.5" width="3" height="10" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M7.5 9.5L7.5 9.51" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M4.5 7C5.36 6.18 6.4 5.75 7.5 5.75C8.6 5.75 9.64 6.18 10.5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M2 4.5C3.5 3 5.4 2.25 7.5 2.25C9.6 2.25 11.5 3 13 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
      <svg width="27" height="12" viewBox="0 0 27 12" fill="none">
        <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" fill="none"/>
        <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/>
        <rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <div class="page-header">
    <button class="icon-btn" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-title">Transactions</div>
    <button class="icon-btn faint" aria-label="Search" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>

  <div class="empty">
    <div class="empty-mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h10"/>
      </svg>
    </div>
    <div class="empty-eyebrow">No entries yet</div>
    <div class="empty-title">Nothing logged yet.</div>
    <div class="empty-body">Your income, spending and transfers will gather here as you record them.</div>
    <button class="empty-cta">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add transaction
    </button>
  </div>

  <div class="home-indicator"></div>
</div>

</body>
</html>
